        history:
          type: array
          items:
            $ref: "#/components/schemas/LayoutHistoryItem"

    LayoutSaveRequest:
      type: object
      required: [canvasSchema]
      properties:
        canvasSchema:
          $ref: "#/components/schemas/CanvasSchemaV1"
        publish:
          type: boolean
          default: false

    LayoutSaveResponse:
      type: object
      required: [draft, published]
      properties:
        draft:
          $ref: "#/components/schemas/LayoutRecord"
        published:
          oneOf:
            - $ref: "#/components/schemas/LayoutRecord"
            - type: "null"
