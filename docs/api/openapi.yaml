          minimum: 0
          maximum: 5000
        y:
          type: number
          minimum: 0
          maximum: 20000
        w:
          type: number
          minimum: 40
          maximum: 2400
        h:
          type: number
          minimum: 24
          maximum: 4000
        zIndex:
          type: integer
          minimum: 0
          maximum: 999

    MobileLayout:
      type: object
      required: [order]
      properties:
        order:
          type: integer
          minimum: 0
          maximum: 9999
        visible:
          type: boolean
          default: true

    NodeStyle:
      type: object
      properties:
        backgroundColor:
          type: string
          maxLength: 40
        textColor:
          type: string
          maxLength: 40
        borderRadius:
          type: number
          minimum: 0
          maximum: 120
        padding:
          type: number
          minimum: 0
          maximum: 120
        shadow:
          type: string
          enum: [none, sm, md, lg]
        animation:
          type: string
