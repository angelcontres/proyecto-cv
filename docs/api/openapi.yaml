      properties:
        id:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
        version:
          type: integer
        canvasSchema:
          $ref: "#/components/schemas/CanvasSchemaV1"
        publishedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LayoutGetResponse:
      type: object
      required: [draft, published, history]
