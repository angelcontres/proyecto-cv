          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin Messages]
      summary: Elimina un mensaje de contacto
      operationId: deleteContactMessage
      x-implemented: true
      x-source: apps/web/src/app/api/admin/messages/[id]/route.ts
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Mensaje eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/layout:
    get:
      tags: [Studio Layout]
      summary: Obtiene borrador actual, versión publicada e historial reciente (hasta 10 versiones)
      operationId: getStudioLayout
      x-implemented: true
      x-source: apps/web/src/app/api/admin/layout/route.ts
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Estado editorial del lienzo Studio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayoutGetResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Studio Layout]
      summary: Guarda cambios en DRAFT y opcionalmente publica una nueva versión archivando la anterior
      operationId: saveStudioLayout
      x-implemented: true
      x-source: apps/web/src/app/api/admin/layout/route.ts
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayoutSaveRequest"
      responses:
        "200":
          description: Borrador (y publicación si `publish=true`) guardados transaccionalmente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayoutSaveResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/assets:
    post:
      tags: [Planned (Fase 2-3)]
      summary: "[PLANIFICADO Fase 2] Subida de fuentes personalizadas (.woff2/.ttf/.otf), imágenes o código"
      operationId: uploadAdminAsset
      x-implemented: false
      x-phase: 2
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind:
                  type: string
                  enum: [IMAGE, FONT, CODE_BUNDLE, OTHER]
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Activo validado y almacenado en `file_assets`
          content:
            application/json:
              schema:
                type: object
                required: [asset]
                properties:
                  asset:
                    $ref: "#/components/schemas/CertificationFileSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/export/pdf:
    get:
      tags: [Planned (Fase 2-3)]
      summary: "[PLANIFICADO Fase 3] Exporta el CV en formato PDF ATS-friendly independiente del lienzo visual"
      operationId: exportAtsPdf
      x-implemented: false
      x-phase: 3
      parameters:
        - name: locale
          in: query
          required: false
          description: Idioma de generación del documento ATS
          schema:
            type: string
            enum: [es, en]
            default: es
      responses:
        "200":
          description: Documento PDF monocromático legible por ATS
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cv_session
      description: Token JWT HS256 firmado con `AUTH_SECRET` y emitido por `POST /api/auth/login`

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Identificador UUID del recurso
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Error de sintaxis JSON o validación Zod de entrada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    Unauthorized:
      description: Cookie de sesión ausente, expirada o inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Recurso inexistente o no perteneciente al perfil autenticado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Límite de frecuencia superado
      headers:
        Retry-After:
          description: Segundos sugeridos antes de reintentar
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    HealthResponse:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: proyecto-cv
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ValidationErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    LocalizedText:
      type: object
      description: Debe incluir texto no vacío en al menos `es` o `en`
      properties:
        es:
          type: string
          maxLength: 4000
        en:
          type: string
          maxLength: 4000

    OptionalLocalizedText:
      type: object
      properties:
        es:
          type: string
          maxLength: 4000
        en:
          type: string
          maxLength: 4000

    LocalizedList:
      type: object
      properties:
        es:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 300
        en:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 300

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128

    SessionUser:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [OWNER, USER, ADMIN]

    AuthUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"

    ProfileUpdateRequest:
      type: object
      required: [slug, localizedInfo, socialLinks]
      properties:
        slug:
          type: string
          minLength: 2
          maxLength: 64
          pattern: "^[a-z0-9-]+$"
        defaultLocale:
          type: string
          enum: [es, en]
          default: es
        localizedInfo:
          type: object
          required: [fullName, headline, bio]
          properties:
            fullName:
              type: string
              minLength: 2
              maxLength: 120
            headline:
              $ref: "#/components/schemas/LocalizedText"
            bio:
              $ref: "#/components/schemas/OptionalLocalizedText"
            location:
              type: string
              maxLength: 120
            availabilityBadge:
              $ref: "#/components/schemas/OptionalLocalizedText"
            publicEmail:
              type: string
        socialLinks:
          type: object
          properties:
            linkedin:
              type: string
            github:
              type: string
            website:
              type: string
            x:
              type: string

    Profile:
      type: object
      required: [id, userId, slug, isPrimary, defaultLocale, localizedInfo, socialLinks, themeConfig]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        slug:
          type: string
        isPrimary:
          type: boolean
        defaultLocale:
          type: string
          enum: [es, en]
        localizedInfo:
          type: object
          additionalProperties: true
        socialLinks:
          type: object
          additionalProperties: true
        themeConfig:
          type: object
          additionalProperties: true
        avatarAssetId:
          type: ["string", "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ExperienceInput:
      type: object
      required: [company, roleI18n, startDate]
      properties:
        company:
          type: string
          minLength: 1
          maxLength: 140
        location:
          type: string
          maxLength: 120
        roleI18n:
          $ref: "#/components/schemas/LocalizedText"
        summaryI18n:
          $ref: "#/components/schemas/OptionalLocalizedText"
        highlightsI18n:
          $ref: "#/components/schemas/LocalizedList"
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40
        startDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        endDate:
          type: ["string", "null"]
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        isCurrent:
          type: boolean
          default: false
        sortOrder:
          type: integer
          minimum: 0
          maximum: 9999
          default: 0
        isVisible:
          type: boolean
          default: true

    Experience:
      allOf:
        - $ref: "#/components/schemas/ExperienceInput"
        - type: object
          required: [id, profileId]
          properties:
            id:
              type: string
              format: uuid
            profileId:
              type: string
              format: uuid
            location:
              type: ["string", "null"]
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    EducationInput:
      type: object
      required: [institution, degreeI18n, startDate]
      properties:
        institution:
          type: string
          minLength: 1
          maxLength: 160
        location:
          type: string
          maxLength: 120
        degreeI18n:
          $ref: "#/components/schemas/LocalizedText"
        summaryI18n:
          $ref: "#/components/schemas/OptionalLocalizedText"
        startDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        endDate:
          type: ["string", "null"]
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        isCurrent:
          type: boolean
          default: false
        sortOrder:
          type: integer
          minimum: 0
          maximum: 9999
          default: 0
        isVisible:
          type: boolean
          default: true

    Education:
      allOf:
        - $ref: "#/components/schemas/EducationInput"
        - type: object
          required: [id, profileId]
          properties:
            id:
              type: string
              format: uuid
            profileId:
              type: string
              format: uuid
            location:
              type: ["string", "null"]
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ProjectInput:
      type: object
      required: [titleI18n]
      properties:
        titleI18n:
          $ref: "#/components/schemas/LocalizedText"
        summaryI18n:
          $ref: "#/components/schemas/OptionalLocalizedText"
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40
        demoUrl:
          type: string
        repoUrl:
          type: string
        year:
          type: ["integer", "null"]
          minimum: 1990
          maximum: 2100
        isFeatured:
          type: boolean
          default: false
        sortOrder:
          type: integer
          minimum: 0
          maximum: 9999
          default: 0
        isVisible:
          type: boolean
          default: true

    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectInput"
        - type: object
          required: [id, profileId]
          properties:
            id:
              type: string
              format: uuid
            profileId:
              type: string
              format: uuid
            demoUrl:
              type: ["string", "null"]
            repoUrl:
              type: ["string", "null"]
            coverAssetId:
              type: ["string", "null"]
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    SkillInput:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        category:
          type: string
          minLength: 1
          maxLength: 60
        level:
          type: integer
          minimum: 1
          maximum: 100
          default: 80
        years:
          type: ["number", "null"]
          minimum: 0
          maximum: 60
        sortOrder:
          type: integer
          minimum: 0
          maximum: 9999
          default: 0
        isVisible:
          type: boolean
          default: true

    Skill:
      allOf:
        - $ref: "#/components/schemas/SkillInput"
        - type: object
