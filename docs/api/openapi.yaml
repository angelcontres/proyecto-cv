    post:
      tags: [Admin Certifications]
      summary: Crea una certificación validando metadatos y archivo PDF opcional por magic bytes
      operationId: createCertification
      x-implemented: true
      x-source: apps/web/src/app/api/admin/certifications/route.ts
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata]
              properties:
                metadata:
                  type: string
                  description: JSON serializado conforme a `CertificationMetadataInput`
                file:
                  type: string
                  format: binary
                  description: Documento PDF válido (`%PDF-`, MIME `application/pdf`, máx. `MAX_PDF_SIZE_MB`)
      responses:
        "201":
          description: Certificación (y opcionalmente `FileAsset`) creados transaccionalmente
