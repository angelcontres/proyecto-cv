          type: integer
          minimum: 800
          maximum: 1920
          default: 1200
        minHeight:
          type: integer
          minimum: 600
          maximum: 20000
          default: 1400
        gridSize:
          type: integer
          minimum: 1
          maximum: 64
          default: 8
        snapToGrid:
          type: boolean
          default: true

    CanvasSchemaV1:
      type: object
      required: [version, canvasSettings, nodes]
      properties:
        version:
          type: integer
          const: 1
        canvasSettings:
