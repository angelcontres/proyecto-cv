          properties:
            id:
              type: string
              format: uuid
            profileId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    CertificationMetadataInput:
      type: object
      required: [titleI18n, issuer, issueDate, category]
      properties:
        titleI18n:
          $ref: "#/components/schemas/LocalizedText"
        issuer:
          type: string
          minLength: 1
          maxLength: 140
        issueDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        expiryDate:
          type: ["string", "null"]
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        category:
          type: string
          minLength: 1
          maxLength: 80
        credentialId:
          type: string
          maxLength: 120
        verifyUrl:
          type: string
        skills:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40
        allowDownload:
          type: boolean
          default: true
        sortOrder:
          type: integer
          minimum: 0
          maximum: 9999
          default: 0
        isVisible:
          type: boolean
          default: true

    CertificationFileSummary:
      type: object
      required: [id, originalName, sizeBytes, mimeType]
      properties:
        id:
          type: string
          format: uuid
        originalName:
          type: string
        sizeBytes:
          type: integer
        mimeType:
          type: string
        createdAt:
          type: string
          format: date-time

    Certification:
      type: object
      required: [id, profileId, titleI18n, issuer, issueDate, category, allowDownload, isVisible]
      properties:
        id:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
        fileAssetId:
          type: ["string", "null"]
          format: uuid
        titleI18n:
          $ref: "#/components/schemas/LocalizedText"
        issuer:
          type: string
        issueDate:
          type: string
          format: date-time
        expiryDate:
          type: ["string", "null"]
          format: date-time
        category:
          type: string
        credentialId:
          type: ["string", "null"]
        verifyUrl:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        allowDownload:
          type: boolean
        sortOrder:
          type: integer
        isVisible:
          type: boolean
        fileAsset:
          oneOf:
            - $ref: "#/components/schemas/CertificationFileSummary"
            - type: "null"

    ContactMessageInput:
      type: object
      required: [senderName, senderEmail, subject, message]
      properties:
        senderName:
          type: string
          minLength: 2
          maxLength: 120
        senderEmail:
          type: string
          format: email
          maxLength: 160
        company:
          type: string
          maxLength: 120
        subject:
          type: string
          minLength: 2
          maxLength: 160
        message:
          type: string
          minLength: 10
          maxLength: 4000
        websiteHoneypot:
          type: string
          description: Campo trampa oculto anti-bots; si contiene texto se descarta con HTTP 201 silencioso

    ContactMessage:
      type: object
      required: [id, profileId, senderName, senderEmail, subject, message, isRead, createdAt]
      properties:
        id:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
        senderName:
          type: string
        senderEmail:
          type: string
          format: email
        company:
          type: ["string", "null"]
        subject:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    MessageMarkReadInput:
      type: object
      required: [isRead]
      properties:
        isRead:
          type: boolean

    CanvasNodeType:
      type: string
      enum:
        - free_text
        - free_image
        - free_card
        - free_button
        - free_badge
        - free_divider
        - custom_code
        - widget_hero
        - widget_timeline
        - widget_projects
        - widget_skills
        - widget_certifications
        - widget_cert_spotlight
        - widget_contact
        - widget_controls

    DesktopFrame:
      type: object
      required: [x, y, w, h, zIndex]
      properties:
