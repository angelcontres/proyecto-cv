openapi: 3.1.0
info:
  title: Proyecto CV - API REST
  version: 1.0.0
  description: |
    Contrato REST del Sistema Web de CV Interactivo con Constructor Visual y Bóveda PDF.
    Documenta las 33 operaciones HTTP actualmente implementadas en el gateway `apps/web/src/app/api/**` delegando en `services/*` (20 archivos `route.ts`),
    junto con 2 endpoints planificados de Fases 2-3 marcados explícitamente con `x-implemented: false`.
  contact:
    name: Arquitectura Proyecto CV
servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local (Next.js App Router)

tags:
  - name: Health
    description: Estado del servicio
  - name: Auth
    description: Inicio, cierre y consulta de sesión mediante cookie HttpOnly JWT
  - name: Public
    description: Endpoints públicos consumidos desde el CV interactivo
  - name: Admin Profile
    description: Configuración del perfil profesional, slug e idiomas
  - name: Admin Career
    description: Gestión CRUD de experiencias, educación, proyectos y habilidades
  - name: Admin Certifications
    description: Bóveda de certificaciones profesionales y respaldo PDF
  - name: Admin Messages
    description: Bandeja de mensajes recibidos desde el formulario de contacto
  - name: Studio Layout
    description: Lectura, guardado Draft y publicación atómica de layouts del Studio
  - name: Planned (Fase 2-3)
    description: Endpoints objetivos planificados en SRS/SAD pendientes de implementación

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Verifica estado del servicio
      operationId: getHealth
      x-implemented: true
      x-source: apps/web/src/app/api/health/route.ts
      responses:
        "200":
          description: Servicio operativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Autentica al propietario y emite cookie HttpOnly cv_session
      operationId: login
      x-implemented: true
      x-source: apps/web/src/app/api/auth/login/route.ts
      x-rateLimit: "8 intentos por 15 minutos por IP y email"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesión iniciada; asigna cookie HttpOnly `cv_session` (HS256, 7 días)
          headers:
            Set-Cookie:
              description: Cookie `cv_session=<jwt>; HttpOnly; SameSite=Lax; Path=/`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Cierra la sesión actual eliminando la cookie cv_session
      operationId: logout
      x-implemented: true
      x-source: apps/web/src/app/api/auth/logout/route.ts
      responses:
        "200":
          description: Cookie de sesión eliminada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Obtiene el usuario autenticado actual desde la cookie cv_session
      operationId: getCurrentUser
      x-implemented: true
      x-source: apps/web/src/app/api/auth/me/route.ts
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Sesión válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/contact:
    post:
      tags: [Public]
      summary: Envía un mensaje público hacia el perfil principal
      operationId: sendContactMessage
      x-implemented: true
      x-source: apps/web/src/app/api/contact/route.ts
      x-rateLimit: "5 peticiones por 10 minutos por IP"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageInput"
      responses:
        "201":
          description: Mensaje registrado (o descartado silenciosamente si `websiteHoneypot` no está vacío)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: No hay perfil activo configurado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/assets/{id}:
    get:
      tags: [Public]
      summary: Entrega controlada de un activo binario (PDF de certificación u otro recurso custodiado)
      operationId: getAssetById
      x-implemented: true
      x-source: apps/web/src/app/api/assets/[id]/route.ts
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: download
          in: query
          required: false
          description: Si vale `"1"` y `allowDownload` o propiedad lo permiten, responde como `attachment`
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Flujo binario del archivo custodiado
          headers:
            Content-Disposition:
              description: "`inline; filename=...` o `attachment; filename=...`"
              schema:
                type: string
            X-Content-Type-Options:
              description: "`nosniff`"
              schema:
                type: string
            Cache-Control:
              description: "`private, max-age=3600`"
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Activo privado y solicitante no propietario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/profile:
    get:
      tags: [Admin Profile]
      summary: Obtiene el perfil principal del usuario autenticado
